[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotask-protocol"
version = "0.1.0"
description = "Shared, transport-agnostic Autotask REST API protocol logic: auth headers, retry/backoff, URL safety, hour-quota policy."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
